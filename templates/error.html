{% extends "base.html" %}

{% block titre %}Erreur {{ code }} — {{ app_nom }}{% endblock %}

{% block contenu %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7 text-center">
      <p class="display-1 fw-bold text-success mb-0">{{ code }}</p>
      <h1 class="h3 fw-bold mb-3">{{ titre }}</h1>
      <p class="text-secondary">{{ message }}</p>
      <div class="d-flex justify-content-center gap-2 mt-4">
        <a class="btn btn-tomate" href="{{ url_for('accueil') }}">
          <i class="bi bi-house me-1"></i>Tableau de bord
        </a>
        <a class="btn btn-outline-secondary" href="{{ url_for('page_analyse') }}">
          <i class="bi bi-search me-1"></i>Analyser une feuille
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
