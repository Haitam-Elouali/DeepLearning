<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2ede2">
  <title>{% block titre %}{{ app_nom }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="page">

  <header class="entete">
    <a class="marque" href="{{ url_for('accueil') }}" aria-label="{{ app_nom }} — accueil">
      <svg class="sceau" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <circle cx="32" cy="32" r="30.5" fill="none" stroke="currentColor" stroke-width="1.1"/>
        <circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="0.6"
                stroke-dasharray="1.5 3.2"/>
        <path d="M45.5 19.5c1 13.8-8.4 23-22.2 23h-3.6c-.6-14 8.5-23 22.4-23h3.4z"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M20.6 43.6c3.4-8.8 9-14.4 17.6-18.6" fill="none" stroke="currentColor"
              stroke-width="1.1" stroke-linecap="round"/>
      </svg>
      <span class="marque-texte">
        <span class="marque-nom">{{ app_nom }}</span>
        <span class="marque-sous">Diagnostic foliaire assisté</span>
      </span>
    </a>
  </header>

  <main>
    {% block contenu %}{% endblock %}
  </main>

</div>
</body>
</html>
